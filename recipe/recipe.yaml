schema_version: 1

context:
  feedstock_name: power-grid-model
  version: "1.13.200"

recipe:
  name: power-grid-model
  version: ${{ version }}

source:
  # url: https://github.com/PowerGridModel/power-grid-model/archive/723f09e3a9823545835a844141c9fe8d330a335c.tar.gz
  # sha256: bdd49ff9000dc7773f61653ff2068475eb831a4fe024dc513684e5c84e7c7622
  url: https://github.com/PowerGridModel/${{ feedstock_name }}/archive/v${{ version }}.tar.gz
  sha256: 8c0cde726cdf112dc2408d2f73f98468456816127c41103aa649719a2f77027b

build:
  number: 1  # TODO revert to 0 before merge
  skip: (python_impl == 'pypy')


# multi stage build to build the C++ library and the Python bindings separately
outputs:
  # Build the C++ library for all platforms
  - package:
      name: "libpower-grid-model"
      version: ${{ version }}

    build:
      script:
        file: ${{ "build_libpower-grid-model.bat" if win else "build_libpower-grid-model.sh" }}
      variant:
        # libpower-grid-model is a pure C++ library
        # so the package is not Python-versioned.
        ignore_keys:
          - python

    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - ninja
        - cmake
        - eigen
        - libboost-devel
        - msgpack-cxx
        - nlohmann_json
        - cli11

      # empty host requirements to avoid pinning the header-only dependencies in runtime
      host:

      run_exports:
        # pin stable ABI on major version
        - ${{ pin_subpackage('libpower-grid-model', upper_bound='x') }}

    tests:
      - files:
          source:
            - tests/package_tests
        requirements:
          run:
            - cmake
            - ninja
            - ${{ compiler('cxx') }}
            - ${{ stdlib("c") }}

        # TODO add test
        script:
          - if: unix
            then:
              - power-grid-model --help
              - power-grid-model --version
              - cd tests/package_tests
              - mkdir build
              - cmake ${CMAKE_ARGS} -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release
              - cmake --build build
              - ./build/power_grid_model_package_test
          - if: win
            then:
              - power-grid-model --help
              - power-grid-model --version
              - cd tests\package_tests
              - mkdir build
              - cmake %CMAKE_ARGS% -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release
              - cmake --build build
              - .\build\power_grid_model_package_test.exe

  # Build the Python bindings only once in Linux x86_64, but it is a noarch package that can be installed on any platform.
  - package:
      name: "power-grid-model"
      version: ${{ version }}

    build:
      noarch: python
      skip: not (linux and x86_64)
      script:
        file: "build_power-grid-model.sh"

    requirements:
      # not build requirements
      build:

      host:
        - python ${{ python_min }}.*
        - scikit-build-core
        - dynamic-metadata
        - pip
      run:
        - python >= ${{ python_min }}
        - ${{ pin_subpackage('libpower-grid-model', upper_bound='x.x.x') }}
        - numpy >=2.0.0

    tests:
      - python:
          imports:
            - power_grid_model
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - files:
          source:
            - tests
            - pyproject.toml
        requirements:
          run:
            - pip
            - pytest
            - pytest-cov
            - msgpack-python
            - colorama
        script:
          - pytest

about:
  summary: Python/C++ library for distribution power system analysis
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://lfenergy.org/projects/power-grid-model/
  repository: https://github.com/PowerGridModel/power-grid-model
  documentation: https://power-grid-model.readthedocs.io/

extra:
  recipe-maintainers:
    - figueroa1395
    - TonyXiang8787
    - mgovers
    - nitbharambe
    - petersalemink95
